name: ci
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  # Webapp-only mirror of mattermost/actions-workflows plugin-ci: the
  # reusable workflow requires Go (setup-go reads go.mod, its lint step runs
  # "go mod tidy" unconditionally), and this repository has no server
  # component. The same lint/test/build pipeline runs here through the same
  # make targets the reusable workflow calls (check-style / test / dist).
  plugin-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sync-manifest.mjs derives the version from git tags
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webapp

      # make targets depend on `apply`, which generates
      # webapp/src/manifest.ts before tsc/vitest/webpack run
      - name: Lint and type check
        run: make check-style

      - name: Unit tests
        run: make test

      - name: Build plugin bundle
        run: make dist

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.tar.gz
          if-no-files-found: error

  coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci
        working-directory: webapp

      - run: make coverage

      - name: Build badge JSON
        run: |
          pct=$(node -p "require('./webapp/coverage/coverage-summary.json').total.lines.pct")
          color=$(node -p "$pct >= 80 ? 'green' : ($pct >= 60 ? 'yellow' : 'red')")
          node -e "const fs=require('fs'); fs.writeFileSync('coverage-badge.json', JSON.stringify({schemaVersion:1,label:'coverage',message:process.argv[1]+'%',color:process.argv[2]}))" "$pct" "$color"
          cat coverage-badge.json

      - name: Publish badge branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin coverage-badge || true
          git checkout -B coverage-badge
          git add coverage-badge.json
          git commit -m "Update coverage badge [skip ci]" || exit 0
          # The badge commit is not part of main's history, so the branch
          # is rewritten on every run.
          git push --force-with-lease origin HEAD:coverage-badge

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download plugin bundle
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # download-artifact v4 nests a single artifact's files one level
      # deeper than expected on some runner versions; flatten so the
      # release step always finds the tarball at the top of dist/.
      - name: Flatten the bundle directory
        run: |
          find dist -mindepth 2 -type f -exec mv -n {} dist/ \;
          find dist -mindepth 1 -type d -exec rmdir {} + 2>/dev/null || true
          ls -la dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.tar.gz
