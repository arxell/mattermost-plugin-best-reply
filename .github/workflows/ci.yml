name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build bundle
        run: npm run build

  bundle:
    runs-on: ubuntu-latest
    needs: webapp
    steps:
      - uses: actions/checkout@v4

      - name: Assemble plugin bundle
        run: make bundle

      - uses: actions/upload-artifact@v4
        with:
          name: com.bestreply.plugin
          path: dist/*.tar.gz
          if-no-files-found: error
